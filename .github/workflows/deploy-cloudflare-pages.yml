name: Deploy voting config to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "prod/**"
      - "stage/**"
      - "test/prod-static-voting-config-duplicate.json"
      - "test/static-voting-config-duplicate.json"
      - "pins/**"
      - "_headers"
      - "scripts/build-cloudflare-pages.sh"
      - "scripts/verify-publication.sh"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

env:
  VOTE_SDK_TAG: v1.3.0-rc.2
  VOTING_CONFIG_ASSET: voting-config-linux-amd64
  VOTING_CONFIG_SHA256: 40c2be2b97e27f2743f9f34107be7c21d9acd9d918bfda7ce61e0070d2f9fb77
  WRANGLER_VERSION: 4.123.0

jobs:
  deploy:
    if: vars.CLOUDFLARE_PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: cloudflare-pages-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      CLOUDFLARE_PAGES_ORIGIN: ${{ vars.CLOUDFLARE_PAGES_ORIGIN }}
      CLOUDFLARE_PAGES_CUSTOM_DOMAIN: ${{ vars.CLOUDFLARE_PAGES_CUSTOM_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install voting-config verifier
        run: |
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL \
            "https://github.com/valargroup/vote-sdk/releases/download/${VOTE_SDK_TAG}/${VOTING_CONFIG_ASSET}" \
            -o "${HOME}/.local/bin/voting-config"
          echo "${VOTING_CONFIG_SHA256}  ${HOME}/.local/bin/voting-config" | sha256sum -c -
          chmod +x "${HOME}/.local/bin/voting-config"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Verify all published configs
        run: |
          voting-config verify --config prod/dynamic-voting-config.json --static-config prod/static-voting-config.json
          voting-config verify --config stage/dynamic-voting-config.json --static-config stage/static-voting-config.json
          voting-config verify --config prod/dynamic-voting-config.json --static-config test/prod-static-voting-config-duplicate.json
          voting-config verify --config stage/dynamic-voting-config.json --static-config test/static-voting-config-duplicate.json

      - name: Build serving snapshot
        env:
          PIN_BASE_REVISION: ${{ github.event.before || format('{0}^', github.sha) }}
          SOURCE_REVISION: ${{ github.sha }}
          PUBLICATION_MODE: automatic
        run: scripts/build-cloudflare-pages.sh _site

      - name: Require explicit Cloudflare target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          for variable_name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_PAGES_PROJECT CLOUDFLARE_PAGES_ORIGIN; do
            if [ -z "${!variable_name:-}" ]; then
              echo "::error title=Missing Cloudflare setting::${variable_name} is required when CLOUDFLARE_PAGES_ENABLED is true."
              exit 1
            fi
          done

      - name: Record current production deployment
        id: previous
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}/deployments?env=production&per_page=1")"
          jq -e '.success == true' <<< "${response}" >/dev/null
          echo "id=$(jq -r '.result[0].id // empty' <<< "${response}")" >> "${GITHUB_OUTPUT}"

      - name: Publish complete snapshot
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy _site \
            --project-name "${CLOUDFLARE_PAGES_PROJECT}" \
            --branch main \
            --commit-hash "${GITHUB_SHA}" \
            --commit-dirty=false
          echo "deployed=true" >> "${GITHUB_OUTPUT}"

      - name: Verify Pages origin
        run: scripts/verify-publication.sh "${CLOUDFLARE_PAGES_ORIGIN}" _site "${GITHUB_SHA}"

      - name: Verify custom domain
        if: env.CLOUDFLARE_PAGES_CUSTOM_DOMAIN != ''
        run: scripts/verify-publication.sh "${CLOUDFLARE_PAGES_CUSTOM_DOMAIN}" _site "${GITHUB_SHA}"

      - name: Roll back failed publication
        if: failure() && steps.publish.outputs.deployed == 'true' && steps.previous.outputs.id != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.previous.outputs.id }}
        run: |
          response="$(curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}/deployments/${PREVIOUS_DEPLOYMENT_ID}/rollback")"
          jq -e '.success == true' <<< "${response}" >/dev/null
