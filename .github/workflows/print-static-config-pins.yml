name: Print static config pins

on:
  pull_request:
    paths:
      - "prod/static-voting-config.json"
      - "stage/static-voting-config.json"
      - "test/static-voting-config-duplicate.json"
      - "test/prod-static-voting-config-duplicate.json"
      - ".github/workflows/print-static-config-pins.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  print-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate static config JSON
        run: |
          python3 -m json.tool prod/static-voting-config.json >/dev/null
          python3 -m json.tool stage/static-voting-config.json >/dev/null
          python3 -m json.tool test/static-voting-config-duplicate.json >/dev/null
          python3 -m json.tool test/prod-static-voting-config-duplicate.json >/dev/null

      - name: Print wallet pin URLs
        run: |
          set -euo pipefail

          prod_hash=$(sha256sum prod/static-voting-config.json | awk '{print $1}')
          stage_hash=$(sha256sum stage/static-voting-config.json | awk '{print $1}')
          prod_duplicate_hash=$(sha256sum test/prod-static-voting-config-duplicate.json | awk '{print $1}')
          stage_duplicate_hash=$(sha256sum test/static-voting-config-duplicate.json | awk '{print $1}')

          prod_url="https://voting.valargroup.dev/pins/prod/${prod_hash}/static-voting-config.json?checksum=sha256:${prod_hash}"
          stage_url="https://voting.valargroup.dev/pins/stage/${stage_hash}/static-voting-config.json?checksum=sha256:${stage_hash}"
          prod_duplicate_url="https://voting.valargroup.dev/test/prod-static-voting-config-duplicate.json?checksum=sha256:${prod_duplicate_hash}"
          stage_duplicate_url="https://voting.valargroup.dev/test/static-voting-config-duplicate.json?checksum=sha256:${stage_duplicate_hash}"

          {
            echo "## Static Config Wallet Pins"
            echo
            echo "| Environment | URL pin |"
            echo "| --- | --- |"
            echo "| production prod folder | \`${prod_url}\` |"
            echo "| staging | \`${stage_url}\` |"
            echo "| production duplicate | \`${prod_duplicate_url}\` |"
            echo "| staging duplicate | \`${stage_duplicate_url}\` |"
            echo
            echo "### Copy/Paste"
            echo
            echo "\`\`\`text"
            echo "production_prod_folder=${prod_url}"
            echo "staging=${stage_url}"
            echo "production_duplicate=${prod_duplicate_url}"
            echo "staging_duplicate=${stage_duplicate_url}"
            echo "\`\`\`"
          } | tee -a "${GITHUB_STEP_SUMMARY}"
