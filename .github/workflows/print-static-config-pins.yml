name: Print static config pins

on:
  pull_request:
    paths:
      - "static-voting-config.json"
      - "stage/static-voting-config.json"
      - ".github/workflows/print-static-config-pins.yml"
  push:
    branches: [main]
    paths:
      - "static-voting-config.json"
      - "stage/static-voting-config.json"
      - ".github/workflows/print-static-config-pins.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  print-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate static config JSON
        run: |
          python3 -m json.tool static-voting-config.json >/dev/null
          python3 -m json.tool stage/static-voting-config.json >/dev/null

      - name: Print wallet pin URLs
        run: |
          set -euo pipefail

          prod_hash=$(sha256sum static-voting-config.json | awk '{print $1}')
          stage_hash=$(sha256sum stage/static-voting-config.json | awk '{print $1}')

          prod_url="https://voting.valargroup.org/static-voting-config.json?checksum=sha256:${prod_hash}"
          stage_url="https://voting.valargroup.org/stage/static-voting-config.json?checksum=sha256:${stage_hash}"

          {
            echo "## Static Config Wallet Pins"
            echo
            echo "| Environment | URL pin |"
            echo "| --- | --- |"
            echo "| production | \`${prod_url}\` |"
            echo "| staging | \`${stage_url}\` |"
            echo
            echo "### Copy/Paste"
            echo
            echo "\`\`\`text"
            echo "production=${prod_url}"
            echo "staging=${stage_url}"
            echo "\`\`\`"
          } | tee -a "${GITHUB_STEP_SUMMARY}"
