name: Print static config pins

on:
  pull_request:
    paths:
      - "static-voting-config.json"
      - "prod/static-voting-config.json"
      - "stage/static-voting-config.json"
      - "test/static-voting-config-duplicate.json"
      - ".github/workflows/print-static-config-pins.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  print-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate static config JSON
        run: |
          python3 -m json.tool static-voting-config.json >/dev/null
          python3 -m json.tool prod/static-voting-config.json >/dev/null
          python3 -m json.tool stage/static-voting-config.json >/dev/null
          python3 -m json.tool test/static-voting-config-duplicate.json >/dev/null

      - name: Print wallet pin URLs
        run: |
          set -euo pipefail

          legacy_hash=$(sha256sum static-voting-config.json | awk '{print $1}')
          prod_hash=$(sha256sum prod/static-voting-config.json | awk '{print $1}')
          stage_hash=$(sha256sum stage/static-voting-config.json | awk '{print $1}')
          duplicate_hash=$(sha256sum test/static-voting-config-duplicate.json | awk '{print $1}')

          legacy_url="https://raw.githubusercontent.com/valargroup/token-holder-voting-config/main/static-voting-config.json?checksum=sha256:${legacy_hash}"
          prod_url="https://raw.githubusercontent.com/valargroup/token-holder-voting-config/main/prod/static-voting-config.json?checksum=sha256:${prod_hash}"
          stage_url="https://raw.githubusercontent.com/valargroup/token-holder-voting-config/main/stage/static-voting-config.json?checksum=sha256:${stage_hash}"
          duplicate_url="https://raw.githubusercontent.com/valargroup/token-holder-voting-config/main/test/static-voting-config-duplicate.json?checksum=sha256:${duplicate_hash}"

          {
            echo "## Static Config Wallet Pins"
            echo
            echo "| Environment | URL pin |"
            echo "| --- | --- |"
            echo "| production | \`${prod_url}\` |"
            echo "| staging | \`${stage_url}\` |"
            echo "| legacy root | \`${legacy_url}\` |"
            echo "| duplicate | \`${duplicate_url}\` |"
            echo
            echo "### Copy/Paste"
            echo
            echo "\`\`\`text"
            echo "production=${prod_url}"
            echo "staging=${stage_url}"
            echo "legacy_root=${legacy_url}"
            echo "duplicate=${duplicate_url}"
            echo "\`\`\`"
          } | tee -a "${GITHUB_STEP_SUMMARY}"
