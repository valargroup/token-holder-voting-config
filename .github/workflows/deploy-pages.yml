name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VOTE_SDK_TAG: v0.5.51
  VOTING_CONFIG_ASSET: voting-config-linux-amd64

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install voting-config verifier
        run: |
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL \
            "https://github.com/valargroup/vote-sdk/releases/download/${VOTE_SDK_TAG}/${VOTING_CONFIG_ASSET}" \
            -o "${HOME}/.local/bin/voting-config"
          chmod +x "${HOME}/.local/bin/voting-config"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Verify voting config
        run: voting-config verify --config voting-config-v2.json --keys trusted_keys.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
