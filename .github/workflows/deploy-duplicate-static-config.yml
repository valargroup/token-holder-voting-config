name: Deploy duplicate static configs

on:
  push:
    branches: [main]
    paths:
      - "test/static-voting-config-duplicate.json"
      - "test/prod-static-voting-config-duplicate.json"
      - ".github/workflows/deploy-duplicate-static-config.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VOTE_SDK_TAG: v1.3.0-rc.2
  VOTING_CONFIG_ASSET: voting-config-linux-amd64
  VOTING_CONFIG_SHA256: 40c2be2b97e27f2743f9f34107be7c21d9acd9d918bfda7ce61e0070d2f9fb77

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install voting-config verifier
        run: |
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL \
            "https://github.com/valargroup/vote-sdk/releases/download/${VOTE_SDK_TAG}/${VOTING_CONFIG_ASSET}" \
            -o "${HOME}/.local/bin/voting-config"
          echo "${VOTING_CONFIG_SHA256}  ${HOME}/.local/bin/voting-config" | sha256sum -c -
          chmod +x "${HOME}/.local/bin/voting-config"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Verify production duplicate static config
        run: voting-config verify --config prod/dynamic-voting-config.json --static-config test/prod-static-voting-config-duplicate.json

      - name: Verify staging duplicate static config
        run: voting-config verify --config stage/dynamic-voting-config.json --static-config test/static-voting-config-duplicate.json

      - name: Verify prod-folder production voting config
        run: voting-config verify --config prod/dynamic-voting-config.json --static-config prod/static-voting-config.json

      - name: Verify staging voting config
        run: voting-config verify --config stage/dynamic-voting-config.json --static-config stage/static-voting-config.json

      - name: Build serving snapshot
        env:
          PIN_BASE_REVISION: ${{ github.event.before || format('{0}^', github.sha) }}
          SOURCE_REVISION: ${{ github.sha }}
          PUBLICATION_MODE: automatic
        run: |
          scripts/build-github-pages.sh _site
          PROD_HASH=$(sha256sum prod/static-voting-config.json | awk '{print $1}')
          STAGE_HASH=$(sha256sum stage/static-voting-config.json | awk '{print $1}')
          PROD_DUPLICATE_HASH=$(sha256sum test/prod-static-voting-config-duplicate.json | awk '{print $1}')
          STAGE_DUPLICATE_HASH=$(sha256sum test/static-voting-config-duplicate.json | awk '{print $1}')
          echo "prod/static-voting-config.json sha256: ${PROD_HASH}"
          echo "stage/static-voting-config.json sha256: ${STAGE_HASH}"
          echo "test/prod-static-voting-config-duplicate.json sha256: ${PROD_DUPLICATE_HASH}"
          echo "test/static-voting-config-duplicate.json sha256: ${STAGE_DUPLICATE_HASH}"
          {
            echo "PROD_PIN_LINE=https://voting.valargroup.dev/pins/prod/${PROD_HASH}/static-voting-config.json?checksum=sha256:${PROD_HASH}"
            echo "STAGE_PIN_LINE=https://voting.valargroup.dev/pins/stage/${STAGE_HASH}/static-voting-config.json?checksum=sha256:${STAGE_HASH}"
            echo "PROD_DUPLICATE_PIN_LINE=https://voting.valargroup.dev/test/prod-static-voting-config-duplicate.json?checksum=sha256:${PROD_DUPLICATE_HASH}"
            echo "STAGE_DUPLICATE_PIN_LINE=https://voting.valargroup.dev/test/static-voting-config-duplicate.json?checksum=sha256:${STAGE_DUPLICATE_HASH}"
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
