name: Deploy duplicate static configs

on:
  push:
    branches: [main]
    paths:
      - "test/static-voting-config-duplicate.json"
      - "test/prod-static-voting-config-duplicate.json"
      - "test/stage-static-voting-config-duplicate.json"
      - ".github/workflows/deploy-duplicate-static-config.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VOTE_SDK_TAG: v0.5.52
  VOTING_CONFIG_ASSET: voting-config-linux-amd64
  VOTING_CONFIG_SHA256: 730173e20fdd84258516f7741ecbe9456db9ea9962483b9c3aa402a31b313ab8

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install voting-config verifier
        run: |
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL \
            "https://github.com/valargroup/vote-sdk/releases/download/${VOTE_SDK_TAG}/${VOTING_CONFIG_ASSET}" \
            -o "${HOME}/.local/bin/voting-config"
          echo "${VOTING_CONFIG_SHA256}  ${HOME}/.local/bin/voting-config" | sha256sum -c -
          chmod +x "${HOME}/.local/bin/voting-config"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Verify production duplicate static config
        run: voting-config verify --config prod/dynamic-voting-config.json --static-config test/prod-static-voting-config-duplicate.json

      - name: Verify legacy production duplicate static config
        run: voting-config verify --config prod/dynamic-voting-config.json --static-config test/static-voting-config-duplicate.json

      - name: Verify staging duplicate static config
        run: voting-config verify --config stage/dynamic-voting-config.json --static-config test/stage-static-voting-config-duplicate.json

      - name: Verify prod-folder production voting config
        run: voting-config verify --config prod/dynamic-voting-config.json --static-config prod/static-voting-config.json

      - name: Verify staging voting config
        run: voting-config verify --config stage/dynamic-voting-config.json --static-config stage/static-voting-config.json

      - name: Compute and publish static config sha256 files
        run: |
          PROD_HASH=$(sha256sum prod/static-voting-config.json | awk '{print $1}')
          STAGE_HASH=$(sha256sum stage/static-voting-config.json | awk '{print $1}')
          LEGACY_DUPLICATE_HASH=$(sha256sum test/static-voting-config-duplicate.json | awk '{print $1}')
          PROD_DUPLICATE_HASH=$(sha256sum test/prod-static-voting-config-duplicate.json | awk '{print $1}')
          STAGE_DUPLICATE_HASH=$(sha256sum test/stage-static-voting-config-duplicate.json | awk '{print $1}')
          echo "prod/static-voting-config.json sha256: ${PROD_HASH}"
          echo "stage/static-voting-config.json sha256: ${STAGE_HASH}"
          echo "test/static-voting-config-duplicate.json sha256: ${LEGACY_DUPLICATE_HASH}"
          echo "test/prod-static-voting-config-duplicate.json sha256: ${PROD_DUPLICATE_HASH}"
          echo "test/stage-static-voting-config-duplicate.json sha256: ${STAGE_DUPLICATE_HASH}"
          echo "${PROD_HASH}  prod/static-voting-config.json" > prod/static-voting-config.json.sha256
          echo "${STAGE_HASH}  stage/static-voting-config.json" > stage/static-voting-config.json.sha256
          echo "${LEGACY_DUPLICATE_HASH}  test/static-voting-config-duplicate.json" > test/static-voting-config-duplicate.json.sha256
          echo "${PROD_DUPLICATE_HASH}  test/prod-static-voting-config-duplicate.json" > test/prod-static-voting-config-duplicate.json.sha256
          echo "${STAGE_DUPLICATE_HASH}  test/stage-static-voting-config-duplicate.json" > test/stage-static-voting-config-duplicate.json.sha256
          {
            echo "PROD_FOLDER_PIN_LINE=https://voting.valargroup.org/prod/static-voting-config.json?checksum=sha256:${PROD_HASH}"
            echo "STAGE_PIN_LINE=https://voting.valargroup.org/stage/static-voting-config.json?checksum=sha256:${STAGE_HASH}"
            echo "LEGACY_PROD_DUPLICATE_PIN_LINE=https://voting.valargroup.org/test/static-voting-config-duplicate.json?checksum=sha256:${LEGACY_DUPLICATE_HASH}"
            echo "PROD_DUPLICATE_PIN_LINE=https://voting.valargroup.org/test/prod-static-voting-config-duplicate.json?checksum=sha256:${PROD_DUPLICATE_HASH}"
            echo "STAGE_DUPLICATE_PIN_LINE=https://voting.valargroup.org/test/stage-static-voting-config-duplicate.json?checksum=sha256:${STAGE_DUPLICATE_HASH}"
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
