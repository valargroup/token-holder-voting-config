name: Verify voting config

on:
  pull_request:
    paths:
      - "voting-config-v2.json"
      - "trusted_keys.json"
      - ".github/workflows/verify-config.yml"
      - ".github/workflows/deploy-pages.yml"
  push:
    branches: [main]
    paths:
      - "voting-config-v2.json"
      - "trusted_keys.json"
      - ".github/workflows/verify-config.yml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VOTE_SDK_TAG: v0.5.51
  VOTING_CONFIG_ASSET: voting-config-linux-amd64
  VOTING_CONFIG_SHA256: 389d1b23790f6f6d168cc4b37bf3920b08611039f2857d722279807a8eb64835

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install voting-config verifier
        run: |
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL \
            "https://github.com/valargroup/vote-sdk/releases/download/${VOTE_SDK_TAG}/${VOTING_CONFIG_ASSET}" \
            -o "${HOME}/.local/bin/voting-config"
          echo "${VOTING_CONFIG_SHA256}  ${HOME}/.local/bin/voting-config" | sha256sum -c -
          chmod +x "${HOME}/.local/bin/voting-config"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      # This verifies only repository-local, deterministic v2 config rules:
      # - voting-config-v2.json parses and has the expected wrapper shape
      # - every round id is valid lowercase hex
      # - trusted_keys.json is a non-empty trusted Ed25519 public-key array
      # - each round entry has at least one signature that verifies over its ea_pk
      #
      # It does not query the chain. Wallets still perform the runtime check that
      # the signed ea_pk in this file matches the ea_pk returned by the chain for
      # the selected round.
      - name: Verify voting config
        run: voting-config verify --config voting-config-v2.json --keys trusted_keys.json
