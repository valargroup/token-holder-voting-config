name: Verify voting config

on:
  pull_request:
    paths:
      - "dynamic-voting-config.json"
      - "static-voting-config.json"
      - "stage/dynamic-voting-config.json"
      - "stage/static-voting-config.json"
      - "test/static-voting-config-duplicate.json"
      - ".github/workflows/verify-config.yml"
      - ".github/workflows/automerge-stage-config.yml"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/deploy-duplicate-static-config.yml"
  push:
    branches: [main]
    paths:
      - "dynamic-voting-config.json"
      - "static-voting-config.json"
      - "stage/dynamic-voting-config.json"
      - "stage/static-voting-config.json"
      - "test/static-voting-config-duplicate.json"
      - ".github/workflows/verify-config.yml"
      - ".github/workflows/automerge-stage-config.yml"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/deploy-duplicate-static-config.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VOTE_SDK_TAG: v0.5.52
  VOTING_CONFIG_ASSET: voting-config-linux-amd64
  VOTING_CONFIG_SHA256: 730173e20fdd84258516f7741ecbe9456db9ea9962483b9c3aa402a31b313ab8

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install voting-config verifier
        run: |
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL \
            "https://github.com/valargroup/vote-sdk/releases/download/${VOTE_SDK_TAG}/${VOTING_CONFIG_ASSET}" \
            -o "${HOME}/.local/bin/voting-config"
          echo "${VOTING_CONFIG_SHA256}  ${HOME}/.local/bin/voting-config" | sha256sum -c -
          chmod +x "${HOME}/.local/bin/voting-config"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      # This verifies only repository-local, deterministic config rules:
      # - dynamic-voting-config.json parses and has the expected wrapper shape
      # - every round id is valid lowercase hex
      # - static-voting-config.json has the expected static config shape
      #   and a non-empty trusted Ed25519 public-key array
      # - each round entry has at least one signature that verifies over its ea_pk
      #
      # It does not query the chain. Wallets still perform the runtime check that
      # the signed ea_pk in this file matches the ea_pk returned by the chain for
      # the selected round.
      - name: Verify production voting config
        run: voting-config verify --config dynamic-voting-config.json --static-config static-voting-config.json

      - name: Verify staging voting config
        run: voting-config verify --config stage/dynamic-voting-config.json --static-config stage/static-voting-config.json

      - name: Verify duplicate static config
        run: voting-config verify --config dynamic-voting-config.json --static-config test/static-voting-config-duplicate.json
