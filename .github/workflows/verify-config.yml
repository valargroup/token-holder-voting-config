name: Verify voting config

on:
  pull_request:
    paths:
      - "prod/dynamic-voting-config.json"
      - "prod/static-voting-config.json"
      - "stage/dynamic-voting-config.json"
      - "stage/static-voting-config.json"
      - "test/static-voting-config-duplicate.json"
      - "test/prod-static-voting-config-duplicate.json"
      - ".github/workflows/verify-config.yml"
      - ".github/workflows/automerge-stage-config.yml"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/deploy-duplicate-static-config.yml"
      - ".github/actions/install-voting-config/**"
  push:
    branches: [main]
    paths:
      - "prod/dynamic-voting-config.json"
      - "prod/static-voting-config.json"
      - "stage/dynamic-voting-config.json"
      - "stage/static-voting-config.json"
      - "test/static-voting-config-duplicate.json"
      - "test/prod-static-voting-config-duplicate.json"
      - ".github/workflows/verify-config.yml"
      - ".github/workflows/automerge-stage-config.yml"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/deploy-duplicate-static-config.yml"
      - ".github/actions/install-voting-config/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/install-voting-config

      # This verifies only repository-local, deterministic config rules:
      # - each dynamic config parses and has the expected wrapper shape
      # - every round id is valid lowercase hex
      # - each static config has the expected static config shape
      #   and a non-empty trusted Ed25519 public-key array
      # - each round entry has at least one signature that verifies over its
      #   auth-version-specific payload
      #
      # It does not query the chain. Wallets still perform the runtime check that
      # the signed ea_pk in this file matches the ea_pk returned by the chain for
      # the selected round.
      - name: Verify prod-folder production voting config
        run: voting-config verify --config prod/dynamic-voting-config.json --static-config prod/static-voting-config.json

      - name: Verify staging voting config
        run: voting-config verify --config stage/dynamic-voting-config.json --static-config stage/static-voting-config.json

      - name: Verify production duplicate static config
        run: voting-config verify --config prod/dynamic-voting-config.json --static-config test/prod-static-voting-config-duplicate.json

      - name: Verify staging duplicate static config
        run: voting-config verify --config stage/dynamic-voting-config.json --static-config test/static-voting-config-duplicate.json
