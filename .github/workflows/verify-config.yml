name: Verify voting config

on:
  pull_request:
    paths:
      - "dynamic-voting-config.json"
      - "static-voting-config-sample.json"
      - ".github/workflows/verify-config.yml"
      - ".github/workflows/deploy-pages.yml"
  push:
    branches: [main]
    paths:
      - "dynamic-voting-config.json"
      - "static-voting-config-sample.json"
      - ".github/workflows/verify-config.yml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VOTE_SDK_TAG: v0.5.52
  VOTING_CONFIG_ASSET: voting-config-linux-amd64
  VOTING_CONFIG_SHA256: 730173e20fdd84258516f7741ecbe9456db9ea9962483b9c3aa402a31b313ab8

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update dynamic config hash pin for verification
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          dynamic_path = Path("dynamic-voting-config.json")
          static_path = Path("static-voting-config-sample.json")

          static_config = json.loads(static_path.read_text(encoding="utf-8"))
          static_config["dynamic_config_sha256"] = hashlib.sha256(dynamic_path.read_bytes()).hexdigest()
          static_path.write_text(
              json.dumps(static_config, indent=2, ensure_ascii=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Install voting-config verifier
        run: |
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL \
            "https://github.com/valargroup/vote-sdk/releases/download/${VOTE_SDK_TAG}/${VOTING_CONFIG_ASSET}" \
            -o "${HOME}/.local/bin/voting-config"
          echo "${VOTING_CONFIG_SHA256}  ${HOME}/.local/bin/voting-config" | sha256sum -c -
          chmod +x "${HOME}/.local/bin/voting-config"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      # This verifies only repository-local, deterministic config rules:
      # - dynamic-voting-config.json parses and has the expected wrapper shape
      # - every round id is valid lowercase hex
      # - static-voting-config-sample.json has the expected static config shape
      #   and a non-empty trusted Ed25519 public-key array
      # - each round entry has at least one signature that verifies over its ea_pk
      #
      # It does not query the chain. Wallets still perform the runtime check that
      # the signed ea_pk in this file matches the ea_pk returned by the chain for
      # the selected round.
      - name: Verify voting config
        run: voting-config verify --config dynamic-voting-config.json --static-config static-voting-config-sample.json

      - name: Verify dynamic config hash pin
        run: |
          python3 - <<'PY'
          import hashlib
          import json

          with open("static-voting-config-sample.json", "r", encoding="utf-8") as static_file:
              expected = json.load(static_file).get("dynamic_config_sha256")

          if expected:
              with open("dynamic-voting-config.json", "rb") as dynamic_file:
                  actual = hashlib.sha256(dynamic_file.read()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"dynamic_config_sha256 mismatch: expected {expected}, got {actual}")
          PY
