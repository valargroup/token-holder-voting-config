name: Verify voting config

on:
  pull_request:
    paths:
      - "voting-config-v2.json"
      - "trusted_keys.json"
      - ".github/workflows/verify-config.yml"
      - ".github/workflows/deploy-pages.yml"
  push:
    branches: [main]
    paths:
      - "voting-config-v2.json"
      - "trusted_keys.json"
      - ".github/workflows/verify-config.yml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Bump to the vote-sdk merge commit that contains cmd/voting-config.
  VOTE_SDK_REF: 7312dc859278a0a40e4c07e2409dde5ad38baccb

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install voting-config verifier
        run: go install github.com/valargroup/vote-sdk/cmd/voting-config@${VOTE_SDK_REF}

      - name: Verify voting config
        run: voting-config verify --config voting-config-v2.json --keys trusted_keys.json
