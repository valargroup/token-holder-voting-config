name: Verify voting config

on:
  pull_request:
    paths:
      - "prod/dynamic-voting-config.json"
      - "prod/pir.json"
      - "prod/static-voting-config.json"
      - "prod/v2-static-voting-config.json"
      - "stage/dynamic-voting-config.json"
      - "stage/pir.json"
      - "stage/static-voting-config.json"
      - "stage/v2-static-voting-config.json"
      - "test/static-voting-config-duplicate.json"
      - "test/prod-static-voting-config-duplicate.json"
      - "pins/**"
      - "*/wallets/**"
      - "_headers"
      - "CNAME"
      - "scripts/build-cloudflare-pages.sh"
      - "scripts/build-github-pages.sh"
      - "scripts/cloudflare-gateway.mjs"
      - "scripts/require-latest-main.sh"
      - "scripts/verify-static-config-compatibility.sh"
      - "scripts/verify-v2-static-configs.sh"
      - "scripts/verify-config-for-publication.sh"
      - "scripts/verify-trusted-key-parity.sh"
      - "scripts/verify-wallet-lists.sh"
      - "scripts/wallet-list-alerts.mjs"
      - "scripts/verify-publication.sh"
      - "scripts/rehearse-github-outage.sh"
      - "scripts/wait-for-live-revision.sh"
      - "scripts/lib/**"
      - "scripts/tests/**"
      - ".github/workflows/verify-config.yml"
      - ".github/workflows/automerge-stage-config.yml"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/deploy-duplicate-static-config.yml"
      - ".github/workflows/deploy-cloudflare-pages.yml"
      - ".github/workflows/monitor-cloudflare-publication.yml"
      - ".github/workflows/wallet-list-alerts.yml"
      - "legacy/**"
  push:
    branches: [main]
    paths:
      - "prod/dynamic-voting-config.json"
      - "prod/pir.json"
      - "prod/static-voting-config.json"
      - "prod/v2-static-voting-config.json"
      - "stage/dynamic-voting-config.json"
      - "stage/pir.json"
      - "stage/static-voting-config.json"
      - "stage/v2-static-voting-config.json"
      - "test/static-voting-config-duplicate.json"
      - "test/prod-static-voting-config-duplicate.json"
      - "pins/**"
      - "*/wallets/**"
      - "_headers"
      - "CNAME"
      - "scripts/build-cloudflare-pages.sh"
      - "scripts/build-github-pages.sh"
      - "scripts/cloudflare-gateway.mjs"
      - "scripts/require-latest-main.sh"
      - "scripts/verify-static-config-compatibility.sh"
      - "scripts/verify-v2-static-configs.sh"
      - "scripts/verify-config-for-publication.sh"
      - "scripts/verify-trusted-key-parity.sh"
      - "scripts/verify-wallet-lists.sh"
      - "scripts/wallet-list-alerts.mjs"
      - "scripts/verify-publication.sh"
      - "scripts/rehearse-github-outage.sh"
      - "scripts/wait-for-live-revision.sh"
      - "scripts/lib/**"
      - "scripts/tests/**"
      - ".github/workflows/verify-config.yml"
      - ".github/workflows/automerge-stage-config.yml"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/deploy-duplicate-static-config.yml"
      - ".github/workflows/deploy-cloudflare-pages.yml"
      - ".github/workflows/monitor-cloudflare-publication.yml"
      - ".github/workflows/wallet-list-alerts.yml"
      - "legacy/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  # The pinned verifier release and the SHA-256 of its asset. Wallet lists and
  # extensions.proxy_delegation_v1 need the first vote-sdk release with the
  # proxy delegation tooling (`voting-config wallet-list`). v1.3.0-rc.2
  # predates it, so CI fails a wallet list or the extension until that release
  # and its hash go here. The deploy, monitor and wallet list alert workflows
  # pin the same release; bump them together.
  VOTE_SDK_TAG: v1.3.0-rc.2
  VOTING_CONFIG_ASSET: voting-config-linux-amd64
  VOTING_CONFIG_SHA256: 40c2be2b97e27f2743f9f34107be7c21d9acd9d918bfda7ce61e0070d2f9fb77

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install voting-config verifier
        run: |
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL \
            "https://github.com/valargroup/vote-sdk/releases/download/${VOTE_SDK_TAG}/${VOTING_CONFIG_ASSET}" \
            -o "${HOME}/.local/bin/voting-config"
          echo "${VOTING_CONFIG_SHA256}  ${HOME}/.local/bin/voting-config" | sha256sum -c -
          chmod +x "${HOME}/.local/bin/voting-config"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      # This verifies only repository-local, deterministic config rules:
      # - each dynamic config parses and has the expected wrapper shape
      # - every round id is valid lowercase hex
      # - each static config has the expected static config shape
      #   and a non-empty trusted Ed25519 public-key array
      # - staging round signatures verify; production round authentication
      #   is left to wallets so historical signatures do not block publication
      #
      # It does not query the chain. Wallets still perform the runtime check that
      # the signed ea_pk in this file matches the ea_pk returned by the chain for
      # the selected round.
      #
      # The pinned verifier predates the v2 static config schema and rejects
      # static_config_version 2 outright, so the v2 files and their pins are
      # verified through scripts/verify-v2-static-configs.sh, which checks the
      # same environment-specific policy via an equivalent v1 projection. The
      # v2-specific shape is enforced by scripts/build-cloudflare-pages.sh.
      - name: Verify v1/v2 trusted key parity
        run: scripts/verify-trusted-key-parity.sh

      - name: Verify prod-folder production voting config
        run: scripts/verify-config-for-publication.sh prod/dynamic-voting-config.json prod/static-voting-config.json

      - name: Verify staging voting config
        run: scripts/verify-config-for-publication.sh stage/dynamic-voting-config.json stage/static-voting-config.json

      # A changed wallet list must raise its version over the list this run's
      # change starts from: a pull request's base branch, the commit a push
      # replaced, or for a manual run its merge base with main.
      - name: Resolve base revision
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              # actions/checkout checks out the pull request's test merge
              # commit, whose first parent is the base branch it merges into.
              if ! git rev-parse --verify --quiet 'HEAD^2' >/dev/null; then
                echo "::error title=Unexpected checkout::Expected the pull request's test merge commit."
                exit 1
              fi
              revision="$(git rev-parse 'HEAD^1')"
              ;;
            push)
              revision="$PUSH_BEFORE"
              ;;
            *)
              revision="$(git merge-base origin/main HEAD)"
              ;;
          esac
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"

      # Each <env>/wallets/<wallet_id>/list.json must verify under the keys
      # its signers.json pins, for the environment's chain. Lists need a
      # voting-config with the wallet-list command; see VOTE_SDK_TAG.
      - name: Verify wallet lists
        env:
          BASE_REVISION: ${{ steps.base.outputs.revision }}
        run: |
          scripts/verify-wallet-lists.sh prod "$BASE_REVISION"
          scripts/verify-wallet-lists.sh stage "$BASE_REVISION"

      - name: Verify production duplicate static config
        run: scripts/verify-config-for-publication.sh prod/dynamic-voting-config.json test/prod-static-voting-config-duplicate.json

      - name: Verify staging duplicate static config
        run: scripts/verify-config-for-publication.sh stage/dynamic-voting-config.json test/static-voting-config-duplicate.json

      - name: Verify v2 static configs
        run: scripts/verify-v2-static-configs.sh

      - name: Verify published static config compatibility
        run: scripts/verify-static-config-compatibility.sh

      - name: Build serving snapshot
        env:
          SOURCE_REVISION: ${{ github.sha }}
          PUBLISHED_AT: "2026-08-17T00:00:00Z"
        run: scripts/build-cloudflare-pages.sh "${RUNNER_TEMP}/voting-config-site"

      - name: Test publication scripts
        run: |
          for test_script in scripts/tests/*.sh; do
            bash "$test_script"
          done
